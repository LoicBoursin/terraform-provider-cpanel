name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ACTIONLINT_VERSION: v1.7.12
  GOVULNCHECK_VERSION: v1.6.0
  GOTOOLCHAIN: go1.26.5
  TERRAFORM_CURRENT_VERSION: 1.15.8
  SYFT_VERSION: v1.42.3

jobs:
  quality:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_CURRENT_VERSION }}
          terraform_wrapper: false
      - run: go mod download
      - run: go mod verify
      - run: go build -v .
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@${{ env.ACTIONLINT_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
      - run: go generate ./...
      - name: Check generated files
        run: git diff --compact-summary --exit-code

  acceptance:
    name: Acceptance tests (Terraform ${{ matrix.terraform }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: cpanel-acceptance
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform:
          - 1.14.9
          - 1.15.8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_API_TOKEN_NAME: ${{ secrets.CPANEL_API_TOKEN_NAME }}
          CPANEL_EXPECTED_TEST_HOST: ${{ secrets.CPANEL_EXPECTED_TEST_HOST }}
          CPANEL_EXPECTED_TEST_USERNAME: ${{ secrets.CPANEL_EXPECTED_TEST_USERNAME }}
          CPANEL_EXPECTED_VERSION: ${{ vars.CPANEL_EXPECTED_VERSION }}
          CPANEL_ACCEPT_DESTRUCTIVE: "1"
          CPANEL_EXPECTED_LOCALE: ${{ vars.CPANEL_EXPECTED_LOCALE }}
          CPANEL_EXPECTED_LOG_ARCHIVE: ${{ vars.CPANEL_EXPECTED_LOG_ARCHIVE }}
          CPANEL_EXPECTED_LOG_PRUNE: ${{ vars.CPANEL_EXPECTED_LOG_PRUNE }}
          CPANEL_EXPECTED_LOG_RETENTION: ${{ vars.CPANEL_EXPECTED_LOG_RETENTION }}
          CPANEL_EXPECTED_NOTIFICATION_PREFERENCES: ${{ vars.CPANEL_EXPECTED_NOTIFICATION_PREFERENCES }}
          CPANEL_EXPECTED_SPAM_PREFERENCES: ${{ vars.CPANEL_EXPECTED_SPAM_PREFERENCES }}
          CPANEL_EXPECTED_GPG_PUBLIC_COUNT: ${{ vars.CPANEL_EXPECTED_GPG_PUBLIC_COUNT }}
          CPANEL_EXPECTED_GPG_SECRET_COUNT: ${{ vars.CPANEL_EXPECTED_GPG_SECRET_COUNT }}
          CPANEL_EXPECTED_SSH_PUBLIC_COUNT: ${{ vars.CPANEL_EXPECTED_SSH_PUBLIC_COUNT }}
          CPANEL_ALLOW_GPG_KEYPAIR_DELETE: "1"
        run: ./scripts/test-acceptance.sh

  release:
    name: Sign and publish
    needs:
      - quality
      - acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Add Syft to PATH
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          ln -s "${{ steps.syft.outputs.cmd }}" "${RUNNER_TEMP}/bin/syft"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
