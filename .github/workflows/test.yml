name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  versions:
    name: Load supported versions
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.versions.outputs.terraform }}
      terraform_current: ${{ steps.versions.outputs.terraform_current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: |
          source scripts/tool-versions.sh
          {
            echo "terraform=${terraform_test_versions_json}"
            echo "terraform_current=${terraform_current_version}"
          } >> "${GITHUB_OUTPUT}"

  quality:
    name: Build, test, and scan
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ needs.versions.outputs.terraform_current }}
          terraform_wrapper: false
      - run: go mod download
      - run: make tools
      - run: make verify
      - run: make release-reproducibility

  generate:
    name: Generated files
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ needs.versions.outputs.terraform_current }}
          terraform_wrapper: false
      - run: go generate ./...
      - name: Check generated files
        run: git diff --compact-summary --exit-code

  acceptance:
    name: Acceptance tests (Terraform ${{ matrix.terraform }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs:
      - quality
      - generate
      - versions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: cpanel-acceptance
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform: ${{ fromJSON(needs.versions.outputs.terraform) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require main for manual acceptance
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual acceptance tests must run from main." >&2
          exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_API_TOKEN_NAME: ${{ secrets.CPANEL_API_TOKEN_NAME }}
        run: ./scripts/cpanel-ci-acceptance.sh
